# Local development infrastructure: Postgres + Redis.
# The Python code runs on your machine (uv run ...) and connects through the ports below.
#
#   docker compose up -d      start both in the background
#   docker compose ps         status (should say "healthy")
#   docker compose down       stop them (Postgres data is kept in the volume)
#   docker compose down -v    stop AND delete the Postgres data

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cfcoach
      POSTGRES_PASSWORD: cfcoach   # local-only dev password; real ones live in the host's env
      POSTGRES_DB: cfcoach
    ports:
      - "127.0.0.1:5432:5432"      # host:container, reachable only from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps the data when the container is removed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfcoach -d cfcoach"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    # No volume on purpose: everything in Redis is cheap to lose (decision #12).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
