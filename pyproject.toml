[project]
name = "cf-coach"
version = "0.1.0"
description = "An agentic AI based tool used to analyse an individual's codeforces data using the public codeforces API"
readme = "README.md"
authors = [
    { name = "Anurag Amchi", email = "anuragamchi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
cf-coach = "cf_coach:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
